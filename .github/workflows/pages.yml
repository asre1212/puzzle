name: Check puzzle app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Verify committed offline release stamp
        run: |
          node scripts/stamp-version.mjs
          git diff --exit-code -- dist/sw.js
# GitHub Pages publishes main / (root) using the repository Pages setting.
# Root index.html opens dist/, which contains the installable PWA.
